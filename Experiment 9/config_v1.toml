# fy_offset = [0, 1]        # fire FY and the FY after, averaged
# columns = ["fp_burden_per_capita_excess"]
# sign = 1

# ---------------------------------------------------------------- weights (order DL, IL, FP, SL)
[weights]
main = "equal"
equal = [0.25, 0.25, 0.25, 0.25]
class_note = [0.35, 0.25, 0.30, 0.10]   # Ray's class note
deck = [0.30, 0.25, 0.25, 0.20]         # mentor policy deck
# "entropy" weights are computed from the data (rows with all four pillars); see PRESPEC.md

# ---------------------------------------------------------------- X sets
[x]
pre = ["H", "E2", "V", "F"]
fire = ["log_share", "peak_ffdi", "severity_high_extreme", "log_homes_in_fire_per_1000", "log_homes_within_1km_per_1000"]

# ---------------------------------------------------------------- models and validation
[rf]
n_estimators = 500
max_features = 0.3333    # p/3 for regression (Bowen, 27 Sep)
min_samples_leaf = 5

[ridge]
alphas = [0.001, 0.00316, 0.01, 0.0316, 0.1, 0.316, 1.0, 3.16, 10.0, 31.6, 100.0, 316.0, 1000.0]

[validation]
council_folds = 5
n_boot = 2000
perm_repeats = 30
shuffle_main = 200
shuffle_pillar = 100
