[weights]
main = [0.25, 0.25, 0.25, 0.25]   # equal, order DL, IL, FP, SL

[x]
pre = ["H", "E2", "V", "F", "X23"]
fire = ["log_share", "peak_ffdi", "severity_high_extreme", "log_homes_in_fire_per_1000", "log_homes_within_1km_per_1000"]

[rf]
n_estimators = 500
max_features = 0.3333
