# Experiment 14 config (Y v4, chosen AFTER seeing v3 results; PRESPEC.md, LOCK_PRESPEC.txt).
# Each [[indicator]] gives, for every Y version it belongs to, the column of inputs/v4_indicators.csv used.
# A version key that is absent = the indicator is not in that Y version.
# Rank rule, pillar rule, composite rule: identical to Experiment 9 (percentile rank after sign, 1 = worst;
# pillar = mean of ranks present; Y = weighted mean of pillars present, re-normalised).
# Y versions: main (Y_v4), olg (OLG-group-matched FAR comparison), resdeaths (SL4 residents only),
# h0 / h12 / h3 (per-horizon). Y_v4_mag uses the "main" columns with z-scores clipped to [-3, 3].

[meta]
version = "4"
label = "v4 (post-v3)"
seed = 20261002

[sources]
indicators = "inputs/v4_indicators.csv"
exp9_table = "../Experiment 9/results/ANALYSIS_TABLE.csv"   # X sets, DL v2, v1 and v3 Ys (read-only)

[[indicator]]
pillar = "DL"
name = "DL1_homes_destroyed_per_1000_dwellings"
sign = 1
main = "homes_per_1000_v2_inferred"
olg = "homes_per_1000_v2_inferred"
resdeaths = "homes_per_1000_v2_inferred"
h0 = "homes_per_1000_v2_inferred"

[[indicator]]
pillar = "IL"
name = "IL2_income_affected_sa2_excess_far"
sign = -1
main = "IL2"
olg = "IL2_olg"
resdeaths = "IL2"
h12 = "IL2"

