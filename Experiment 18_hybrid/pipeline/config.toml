[ridge]
alphas = [0.001, 0.00316, 0.01, 0.0316, 0.1, 0.316, 1.0, 3.16, 10.0, 31.6, 100.0, 316.0, 1000.0]

[validation]
council_folds = 5
n_boot = 2000
perm_repeats = 30
shuffle_main = 200
shuffle_pillar = 100
